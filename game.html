<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Neon Drift — Survie Spatiale</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
        height: 100%;
        overflow: hidden;
        background: #05060f;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        color: #e8ecff;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
    }
    #game {
        display: block;
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        cursor: crosshair;
    }
    /* HUD */
    #hud {
        position: absolute;
        top: 0; left: 0; right: 0;
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        padding: 18px 22px;
        pointer-events: none;
        z-index: 5;
        text-shadow: 0 0 12px rgba(0,0,0,0.8);
    }
    .hud-block { font-variant-numeric: tabular-nums; }
    .hud-label {
        font-size: 0.7rem;
        letter-spacing: 2px;
        text-transform: uppercase;
        opacity: 0.55;
        margin-bottom: 2px;
    }
    .hud-value { font-size: 1.6rem; font-weight: 700; line-height: 1; }
    #score .hud-value { color: #4ff0ff; }
    #wave .hud-value  { color: #ff6ad5; }
    #hud.right { text-align: right; }

    /* Health bar */
    #healthwrap {
        position: absolute;
        bottom: 22px; left: 50%;
        transform: translateX(-50%);
        width: min(340px, 70vw);
        z-index: 5;
        pointer-events: none;
    }
    #healthbar-bg {
        height: 10px;
        border-radius: 6px;
        background: rgba(255,255,255,0.08);
        overflow: hidden;
        box-shadow: inset 0 0 0 1px rgba(255,255,255,0.12);
    }
    #healthbar {
        height: 100%;
        width: 100%;
        background: linear-gradient(90deg, #4ff0ff, #6affa8);
        transition: width 0.15s ease, background 0.3s;
        border-radius: 6px;
    }

    /* Overlays */
    .overlay {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.2rem;
        text-align: center;
        z-index: 10;
        background: radial-gradient(ellipse at center, rgba(10,12,30,0.55), rgba(5,6,15,0.92));
        padding: 2rem;
        backdrop-filter: blur(3px);
    }
    .overlay.hidden { display: none; }
    .title {
        font-size: clamp(2.4rem, 9vw, 4.5rem);
        font-weight: 800;
        letter-spacing: 4px;
        background: linear-gradient(90deg, #4ff0ff, #ff6ad5, #ffd24f);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        filter: drop-shadow(0 0 22px rgba(79,240,255,0.35));
        line-height: 1;
    }
    .subtitle { font-size: 1.05rem; opacity: 0.8; max-width: 460px; line-height: 1.55; }
    .btn {
        pointer-events: auto;
        cursor: pointer;
        border: none;
        padding: 0.9rem 2.4rem;
        border-radius: 50px;
        font-size: 1.05rem;
        font-weight: 700;
        letter-spacing: 1px;
        color: #05060f;
        background: linear-gradient(90deg, #4ff0ff, #6affa8);
        box-shadow: 0 0 30px rgba(79,240,255,0.45);
        transition: transform 0.12s, box-shadow 0.12s;
    }
    .btn:hover { transform: scale(1.05); box-shadow: 0 0 44px rgba(79,240,255,0.7); }
    .btn:active { transform: scale(0.97); }
    .controls-hint {
        display: flex; gap: 1.5rem; flex-wrap: wrap; justify-content: center;
        opacity: 0.7; font-size: 0.85rem; margin-top: 0.4rem;
    }
    .controls-hint span strong { color: #4ff0ff; }
    .big-score { font-size: 3rem; font-weight: 800; color: #ffd24f; }
    .big-score small { display:block; font-size: 0.9rem; opacity: 0.6; letter-spacing: 2px; text-transform: uppercase; font-weight: 500; }
    .best-line { opacity: 0.75; font-size: 0.95rem; }
    #flash {
        position: absolute; inset: 0; z-index: 8; pointer-events: none;
        background: #ff2e63; opacity: 0; transition: opacity 0.12s;
    }
</style>
</head>
<body>

<canvas id="game"></canvas>
<div id="flash"></div>

<div id="hud">
    <div class="hud-block" id="score">
        <div class="hud-label">Score</div>
        <div class="hud-value">0</div>
    </div>
    <div class="hud-block right" id="wave">
        <div class="hud-label">Vague</div>
        <div class="hud-value">1</div>
    </div>
</div>

<div id="healthwrap"><div id="healthbar-bg"><div id="healthbar"></div></div></div>

<!-- Start screen -->
<div class="overlay" id="start-screen">
    <div class="title">NEON&nbsp;DRIFT</div>
    <p class="subtitle">Pilote ton vaisseau, esquive les astéroïdes et pulvérise l'essaim ennemi. Chaque vague est plus rapide. Combien de temps tiendras-tu&nbsp;?</p>
    <button class="btn" id="start-btn">JOUER</button>
    <div class="controls-hint">
        <span><strong>Souris</strong> viser</span>
        <span><strong>Clic / Espace</strong> tirer</span>
        <span><strong>ZQSD / Flèches</strong> se déplacer</span>
    </div>
</div>

<!-- Game over screen -->
<div class="overlay hidden" id="over-screen">
    <div class="title">GAME&nbsp;OVER</div>
    <div class="big-score"><span id="final-score">0</span><small>Score final</small></div>
    <div class="best-line">Meilleur&nbsp;: <strong id="best-score">0</strong> · Vague&nbsp;<strong id="final-wave">1</strong></div>
    <button class="btn" id="retry-btn">REJOUER</button>
</div>

<script>
(() => {
    "use strict";
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const flashEl = document.getElementById('flash');
    const hudScore = document.querySelector('#score .hud-value');
    const hudWave  = document.querySelector('#wave .hud-value');
    const healthbar = document.getElementById('healthbar');
    const startScreen = document.getElementById('start-screen');
    const overScreen = document.getElementById('over-screen');

    let W = 0, H = 0, DPR = 1;
    function resize() {
        DPR = Math.min(window.devicePixelRatio || 1, 2);
        W = window.innerWidth; H = window.innerHeight;
        canvas.width = W * DPR; canvas.height = H * DPR;
        canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
        ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    }
    window.addEventListener('resize', resize);
    resize();

    // ---------- Audio (WebAudio, no assets) ----------
    let actx = null;
    function audio() {
        if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
        return actx;
    }
    function beep(freq, dur, type = 'square', vol = 0.15, slide = 0) {
        const a = audio(); if (!a) return;
        const t = a.currentTime;
        const osc = a.createOscillator();
        const g = a.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, t);
        if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(20, freq + slide), t + dur);
        g.gain.setValueAtTime(vol, t);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        osc.connect(g); g.connect(a.destination);
        osc.start(t); osc.stop(t + dur);
    }
    const sfx = {
        shoot: () => beep(660, 0.08, 'square', 0.08, -300),
        hit:   () => beep(220, 0.12, 'sawtooth', 0.12, -120),
        boom:  () => beep(90, 0.35, 'sawtooth', 0.22, -60),
        hurt:  () => beep(140, 0.3, 'square', 0.25, -80),
        wave:  () => { beep(523, 0.12, 'triangle', 0.15); setTimeout(() => beep(784, 0.18, 'triangle', 0.15), 110); },
    };

    // ---------- Utils ----------
    const rand = (a, b) => a + Math.random() * (b - a);
    const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
    const dist2 = (ax, ay, bx, by) => { const dx = ax - bx, dy = ay - by; return dx*dx + dy*dy; };

    // ---------- Entities ----------
    let stars = [];
    function initStars() {
        stars = [];
        const n = Math.floor((W * H) / 6000);
        for (let i = 0; i < n; i++) {
            stars.push({ x: rand(0, W), y: rand(0, H), z: rand(0.2, 1), s: rand(0.4, 1.8) });
        }
    }
    initStars();

    const player = {
        x: W/2, y: H/2, r: 14, angle: 0,
        vx: 0, vy: 0, speed: 0.55, friction: 0.90,
        hp: 100, maxhp: 100, cool: 0, invuln: 0,
    };

    let bullets = [], enemies = [], asteroids = [], particles = [], floaters = [];
    let score = 0, wave = 1, waveTimer = 0, spawnClock = 0, shake = 0;
    let running = false, lastT = 0;
    let best = 0;
    try { best = parseInt(localStorage.getItem('neondrift_best') || '0', 10) || 0; } catch(e){}

    const keys = {};
    const mouse = { x: W/2, y: H/2, down: false };

    // ---------- Input ----------
    window.addEventListener('keydown', e => {
        keys[e.key.toLowerCase()] = true;
        if ([' ', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright'].includes(e.key.toLowerCase())) e.preventDefault();
    });
    window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

    function pointerPos(e) {
        const t = e.touches ? e.touches[0] : e;
        return { x: t.clientX, y: t.clientY };
    }
    canvas.addEventListener('mousemove', e => { const p = pointerPos(e); mouse.x = p.x; mouse.y = p.y; });
    canvas.addEventListener('mousedown', e => { mouse.down = true; audio(); });
    window.addEventListener('mouseup', () => { mouse.down = false; });
    canvas.addEventListener('touchstart', e => { e.preventDefault(); const p = pointerPos(e); mouse.x = p.x; mouse.y = p.y; mouse.down = true; audio(); }, { passive: false });
    canvas.addEventListener('touchmove', e => { e.preventDefault(); const p = pointerPos(e); mouse.x = p.x; mouse.y = p.y; }, { passive: false });
    window.addEventListener('touchend', () => { mouse.down = false; });

    // ---------- Spawning ----------
    function spawnEnemy() {
        const edge = Math.floor(rand(0, 4));
        let x, y;
        if (edge === 0) { x = rand(0, W); y = -30; }
        else if (edge === 1) { x = W + 30; y = rand(0, H); }
        else if (edge === 2) { x = rand(0, W); y = H + 30; }
        else { x = -30; y = rand(0, H); }
        const spd = 0.9 + wave * 0.12;
        enemies.push({
            x, y, r: rand(11, 16),
            spd: rand(spd * 0.7, spd),
            hp: 1 + Math.floor(wave / 4),
            hue: rand(300, 345), wob: rand(0, 6.28),
        });
    }
    function spawnAsteroid() {
        const edge = Math.floor(rand(0, 4));
        let x, y;
        if (edge === 0) { x = rand(0, W); y = -50; }
        else if (edge === 1) { x = W + 50; y = rand(0, H); }
        else if (edge === 2) { x = rand(0, W); y = H + 50; }
        else { x = -50; y = rand(0, H); }
        const ang = Math.atan2(H/2 - y, W/2 - x) + rand(-0.5, 0.5);
        const r = rand(22, 40);
        const verts = [];
        const n = Math.floor(rand(7, 11));
        for (let i = 0; i < n; i++) verts.push(rand(0.72, 1.15));
        asteroids.push({
            x, y, r, verts,
            vx: Math.cos(ang) * rand(0.5, 1.2), vy: Math.sin(ang) * rand(0.5, 1.2),
            spin: rand(-0.02, 0.02), rot: rand(0, 6.28),
        });
    }

    function burst(x, y, color, n, spd) {
        for (let i = 0; i < n; i++) {
            const a = rand(0, 6.28), s = rand(spd * 0.3, spd);
            particles.push({ x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s, life: 1, decay: rand(0.015, 0.04), color, size: rand(1.5, 3.5) });
        }
    }
    function floatText(x, y, text, color) {
        floaters.push({ x, y, text, color, life: 1 });
    }

    // ---------- Game flow ----------
    function reset() {
        bullets = []; enemies = []; asteroids = []; particles = []; floaters = [];
        score = 0; wave = 1; waveTimer = 0; spawnClock = 0; shake = 0;
        player.x = W/2; player.y = H/2; player.vx = player.vy = 0;
        player.hp = player.maxhp; player.cool = 0; player.invuln = 60;
        updateHUD();
    }
    function startGame() {
        audio();
        reset();
        startScreen.classList.add('hidden');
        overScreen.classList.add('hidden');
        running = true;
        lastT = performance.now();
        requestAnimationFrame(loop);
    }
    function gameOver() {
        running = false;
        sfx.boom();
        burst(player.x, player.y, '#4ff0ff', 60, 7);
        shake = 26;
        if (score > best) { best = score; try { localStorage.setItem('neondrift_best', String(best)); } catch(e){} }
        document.getElementById('final-score').textContent = score;
        document.getElementById('final-wave').textContent = wave;
        document.getElementById('best-score').textContent = best;
        setTimeout(() => overScreen.classList.remove('hidden'), 700);
    }

    function updateHUD() {
        hudScore.textContent = score;
        hudWave.textContent = wave;
        const pct = clamp(player.hp / player.maxhp, 0, 1) * 100;
        healthbar.style.width = pct + '%';
        healthbar.style.background = pct > 50
            ? 'linear-gradient(90deg,#4ff0ff,#6affa8)'
            : pct > 25 ? 'linear-gradient(90deg,#ffd24f,#ff9f4f)'
            : 'linear-gradient(90deg,#ff6a4f,#ff2e63)';
    }

    function doFlash() {
        flashEl.style.opacity = '0.4';
        setTimeout(() => flashEl.style.opacity = '0', 90);
    }

    // ---------- Update ----------
    function update(dt) {
        // dt normalized to ~60fps steps
        const s = dt;

        // wave progression
        waveTimer += dt;
        if (waveTimer > 60 * 12) { // ~12s per wave
            waveTimer = 0; wave++; sfx.wave();
            floatText(W/2, H/2 - 40, 'VAGUE ' + wave, '#ff6ad5');
            updateHUD();
        }

        // spawn cadence scales with wave
        spawnClock += dt;
        const spawnEvery = Math.max(22, 70 - wave * 4);
        if (spawnClock > spawnEvery) {
            spawnClock = 0;
            spawnEnemy();
            if (Math.random() < 0.35 + wave * 0.02) spawnEnemy();
            if (Math.random() < 0.4) spawnAsteroid();
        }

        // player movement
        let ax = 0, ay = 0;
        if (keys['arrowleft'] || keys['q'] || keys['a']) ax -= 1;
        if (keys['arrowright'] || keys['d']) ax += 1;
        if (keys['arrowup'] || keys['z'] || keys['w']) ay -= 1;
        if (keys['arrowdown'] || keys['s']) ay += 1;
        if (ax || ay) {
            const l = Math.hypot(ax, ay);
            player.vx += (ax/l) * player.speed * s;
            player.vy += (ay/l) * player.speed * s;
            if (Math.random() < 0.5) burst(player.x - Math.cos(player.angle)*14, player.y - Math.sin(player.angle)*14, '#4ff0ff', 1, 1.5);
        }
        player.vx *= Math.pow(player.friction, s);
        player.vy *= Math.pow(player.friction, s);
        player.x = clamp(player.x + player.vx * s, player.r, W - player.r);
        player.y = clamp(player.y + player.vy * s, player.r, H - player.r);
        player.angle = Math.atan2(mouse.y - player.y, mouse.x - player.x);
        if (player.invuln > 0) player.invuln -= dt;

        // shooting
        player.cool -= dt;
        const wantShoot = mouse.down || keys[' '];
        if (wantShoot && player.cool <= 0) {
            player.cool = 9;
            const sp = 11;
            bullets.push({
                x: player.x + Math.cos(player.angle)*18,
                y: player.y + Math.sin(player.angle)*18,
                vx: Math.cos(player.angle)*sp, vy: Math.sin(player.angle)*sp, life: 70,
            });
            sfx.shoot();
            player.vx -= Math.cos(player.angle) * 0.6;
            player.vy -= Math.sin(player.angle) * 0.6;
        }

        // bullets
        for (let i = bullets.length - 1; i >= 0; i--) {
            const b = bullets[i];
            b.x += b.vx * s; b.y += b.vy * s; b.life -= dt;
            if (b.life <= 0 || b.x < -20 || b.x > W+20 || b.y < -20 || b.y > H+20) { bullets.splice(i, 1); continue; }
        }

        // enemies
        for (let i = enemies.length - 1; i >= 0; i--) {
            const e = enemies[i];
            e.wob += 0.1 * s;
            const ang = Math.atan2(player.y - e.y, player.x - e.x);
            e.x += (Math.cos(ang) * e.spd + Math.cos(e.wob) * 0.4) * s;
            e.y += (Math.sin(ang) * e.spd + Math.sin(e.wob) * 0.4) * s;

            // bullet collision
            for (let j = bullets.length - 1; j >= 0; j--) {
                const b = bullets[j];
                if (dist2(e.x, e.y, b.x, b.y) < (e.r + 4) * (e.r + 4)) {
                    bullets.splice(j, 1);
                    e.hp--;
                    burst(b.x, b.y, 'hsl(' + e.hue + ',90%,65%)', 5, 3);
                    sfx.hit();
                    if (e.hp <= 0) {
                        burst(e.x, e.y, 'hsl(' + e.hue + ',90%,65%)', 18, 5);
                        score += 10;
                        floatText(e.x, e.y, '+10', '#4ff0ff');
                        enemies.splice(i, 1);
                        updateHUD();
                        shake = Math.max(shake, 4);
                    }
                    break;
                }
            }
            if (i >= enemies.length || enemies[i] !== e) continue;

            // player collision
            if (player.invuln <= 0 && dist2(e.x, e.y, player.x, player.y) < (e.r + player.r) * (e.r + player.r)) {
                enemies.splice(i, 1);
                damage(16, e.x, e.y);
            }
        }

        // asteroids
        for (let i = asteroids.length - 1; i >= 0; i--) {
            const a2 = asteroids[i];
            a2.x += a2.vx * s; a2.y += a2.vy * s; a2.rot += a2.spin * s;
            if (a2.x < -80 || a2.x > W+80 || a2.y < -80 || a2.y > H+80) { asteroids.splice(i, 1); continue; }

            for (let j = bullets.length - 1; j >= 0; j--) {
                const b = bullets[j];
                if (dist2(a2.x, a2.y, b.x, b.y) < a2.r * a2.r) {
                    bullets.splice(j, 1);
                    burst(b.x, b.y, '#c9d2ff', 4, 2.5);
                    a2.r -= 6;
                    if (a2.r < 14) {
                        burst(a2.x, a2.y, '#c9d2ff', 14, 4);
                        score += 5; floatText(a2.x, a2.y, '+5', '#c9d2ff');
                        asteroids.splice(i, 1); updateHUD();
                        sfx.hit();
                    }
                    break;
                }
            }
            if (i >= asteroids.length || asteroids[i] !== a2) continue;

            if (player.invuln <= 0 && dist2(a2.x, a2.y, player.x, player.y) < (a2.r + player.r) * (a2.r + player.r)) {
                damage(22, a2.x, a2.y);
                a2.vx *= -0.6; a2.vy *= -0.6;
            }
        }

        // particles
        for (let i = particles.length - 1; i >= 0; i--) {
            const p = particles[i];
            p.x += p.vx * s; p.y += p.vy * s;
            p.vx *= 0.96; p.vy *= 0.96;
            p.life -= p.decay * s;
            if (p.life <= 0) particles.splice(i, 1);
        }
        // floaters
        for (let i = floaters.length - 1; i >= 0; i--) {
            const f = floaters[i];
            f.y -= 0.7 * s; f.life -= 0.02 * s;
            if (f.life <= 0) floaters.splice(i, 1);
        }

        // stars parallax drift
        for (const st of stars) {
            st.x -= (player.vx * 0.02 * st.z) * s;
            st.y -= (player.vy * 0.02 * st.z) * s;
            if (st.x < 0) st.x += W; if (st.x > W) st.x -= W;
            if (st.y < 0) st.y += H; if (st.y > H) st.y -= H;
        }

        if (shake > 0) shake -= dt * 0.8;
    }

    function damage(amount, x, y) {
        player.hp -= amount;
        player.invuln = 45;
        shake = Math.max(shake, 14);
        doFlash();
        sfx.hurt();
        burst(x, y, '#ff2e63', 16, 5);
        updateHUD();
        if (player.hp <= 0) { player.hp = 0; updateHUD(); gameOver(); }
    }

    // ---------- Render ----------
    function draw() {
        ctx.save();
        // screen shake
        if (shake > 0.3) {
            ctx.translate(rand(-shake, shake), rand(-shake, shake));
        }

        // background
        ctx.fillStyle = '#05060f';
        ctx.fillRect(-40, -40, W + 80, H + 80);

        // nebula glow
        const g = ctx.createRadialGradient(W*0.7, H*0.25, 0, W*0.7, H*0.25, Math.max(W,H)*0.7);
        g.addColorStop(0, 'rgba(80,40,120,0.18)');
        g.addColorStop(1, 'rgba(5,6,15,0)');
        ctx.fillStyle = g;
        ctx.fillRect(-40, -40, W + 80, H + 80);

        // stars
        for (const st of stars) {
            ctx.globalAlpha = st.z;
            ctx.fillStyle = st.z > 0.7 ? '#cfe0ff' : '#7080b0';
            ctx.fillRect(st.x, st.y, st.s, st.s);
        }
        ctx.globalAlpha = 1;

        // asteroids
        for (const a2 of asteroids) {
            ctx.save();
            ctx.translate(a2.x, a2.y); ctx.rotate(a2.rot);
            ctx.beginPath();
            const n = a2.verts.length;
            for (let i = 0; i <= n; i++) {
                const ang = (i % n) / n * 6.283;
                const rr = a2.r * a2.verts[i % n];
                const px = Math.cos(ang) * rr, py = Math.sin(ang) * rr;
                i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
            }
            ctx.closePath();
            ctx.fillStyle = 'rgba(40,46,80,0.85)';
            ctx.fill();
            ctx.lineWidth = 2; ctx.strokeStyle = '#8f9cd8';
            ctx.stroke();
            ctx.restore();
        }

        // bullets
        ctx.shadowBlur = 12; ctx.shadowColor = '#4ff0ff';
        for (const b of bullets) {
            ctx.fillStyle = '#bafcff';
            ctx.beginPath(); ctx.arc(b.x, b.y, 3.5, 0, 6.283); ctx.fill();
        }
        ctx.shadowBlur = 0;

        // enemies
        for (const e of enemies) {
            ctx.save();
            ctx.translate(e.x, e.y);
            const c = 'hsl(' + e.hue + ',90%,62%)';
            ctx.shadowBlur = 14; ctx.shadowColor = c;
            ctx.fillStyle = c;
            ctx.beginPath();
            for (let i = 0; i < 3; i++) {
                const ang = e.wob + i * 2.094;
                const px = Math.cos(ang) * e.r, py = Math.sin(ang) * e.r;
                i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
            }
            ctx.closePath(); ctx.fill();
            ctx.shadowBlur = 0;
            ctx.fillStyle = '#fff';
            ctx.beginPath(); ctx.arc(0, 0, e.r*0.28, 0, 6.283); ctx.fill();
            ctx.restore();
        }

        // particles
        for (const p of particles) {
            ctx.globalAlpha = clamp(p.life, 0, 1);
            ctx.fillStyle = p.color;
            ctx.fillRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size);
        }
        ctx.globalAlpha = 1;

        // player
        if (running) {
            const blink = player.invuln > 0 && Math.floor(player.invuln / 4) % 2 === 0;
            if (!blink) {
                ctx.save();
                ctx.translate(player.x, player.y);
                ctx.rotate(player.angle);
                ctx.shadowBlur = 18; ctx.shadowColor = '#4ff0ff';
                ctx.fillStyle = '#eafcff';
                ctx.beginPath();
                ctx.moveTo(18, 0);
                ctx.lineTo(-12, -11);
                ctx.lineTo(-6, 0);
                ctx.lineTo(-12, 11);
                ctx.closePath();
                ctx.fill();
                ctx.strokeStyle = '#4ff0ff'; ctx.lineWidth = 2; ctx.stroke();
                ctx.shadowBlur = 0;
                ctx.restore();
            }
        }

        // floaters
        ctx.textAlign = 'center';
        ctx.font = '700 18px -apple-system, sans-serif';
        for (const f of floaters) {
            ctx.globalAlpha = clamp(f.life, 0, 1);
            ctx.fillStyle = f.color;
            ctx.fillText(f.text, f.x, f.y);
        }
        ctx.globalAlpha = 1;

        ctx.restore();
    }

    // ---------- Loop ----------
    function loop(t) {
        if (!running) return;
        let dt = (t - lastT) / 16.666;
        lastT = t;
        if (dt > 3) dt = 3; // clamp big frame gaps
        update(dt);
        draw();
        requestAnimationFrame(loop);
    }

    // idle background animation on menus
    function idle(t) {
        if (running) return;
        for (const st of stars) { st.x -= 0.05 * st.z; if (st.x < 0) st.x += W; }
        draw();
        requestAnimationFrame(idle);
    }

    document.getElementById('start-btn').addEventListener('click', startGame);
    document.getElementById('retry-btn').addEventListener('click', startGame);

    window.addEventListener('resize', () => { initStars(); });

    updateHUD();
    requestAnimationFrame(idle);
})();
</script>
</body>
</html>
